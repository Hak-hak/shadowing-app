    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var boundFetch = origFetch ? origFetch.bind(window) : null;
          var _customFetch = boundFetch;

          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _customFetch || boundFetch;
              },
              set: function(val) {
                _customFetch = typeof val === 'function' ? val : boundFetch;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {
          // Passively ignore if environment locks down window descriptor
        }

        var isFetchGetterError = function(msg) {
          return typeof msg === 'string' &&
            msg.indexOf('fetch') !== -1 &&
            (msg.indexOf('getter') !== -1 || msg.indexOf('Cannot set property') !== -1);
        };

        window.addEventListener('error', function(e) {
          if (e && (isFetchGetterError(e.message) || (e.error && isFetchGetterError(e.error.message)))) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          if (isFetchGetterError(msg) || (err && isFetchGetterError(err.message))) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };
      })();
    </script>
